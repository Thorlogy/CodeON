name: CodeON unit tests

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master, develop ]

permissions:
  contents: read

jobs:
  windows-starter-smoke:
    name: Windows Java 21 starter database smoke
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout branch ${{ github.ref }} of repo ${{ github.repository }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Java JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verify Windows starter runtime
        shell: pwsh
        run: |
          java -version
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Create fresh CodeON database via Windows starter
        env:
          CODEON_JAVA_STARTUP_SMOKE: '1'
        run: python -m unittest RobotRCX/src/test/python/test_start_codeon_rcx.py

  build-matrix:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '21' ]
    steps:
      - name: Checkout branch ${{ github.ref }} of repo ${{ github.repository }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Java JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Cache local maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java${{ matrix.java }}-
      - name: Verify generated constants
        run: npm run test:constants
      - name: Test read-only connection diagnostics
        run: npm run test:connection-diagnostics
      - name: Test local Java startup assistant
        env:
          CODEON_JAVA_STARTUP_SMOKE: '1'
        run: python3 -m unittest RobotRCX/src/test/python/test_start_codeon_rcx.py
      - name: Test active CodeON robot reactor
        run: mvn --batch-mode -pl OpenRobertaRobot,RobotEdison,RobotSpike,RobotCozmo,RobotApitor,RobotRCX -am -DargLine='--add-opens java.base/java.lang=ALL-UNNAMED' test
      - name: Test CodeON LEGACY programs and local server binding
        run: mvn --batch-mode -pl OpenRobertaServer -am -Dtest=CodeOnLegacyProgramRegressionTest,ServerStarterLoopbackTest -DfailIfNoTests=false -DargLine='--add-opens java.base/java.lang=ALL-UNNAMED' test
      - name: Package CodeON server reactor
        run: mvn --batch-mode -pl OpenRobertaServer -am -DskipTests package

  # Keep the branch-protection check named "build" and require every test job.
  build:
    runs-on: ubuntu-22.04
    needs: [build-matrix, windows-starter-smoke]
    if: ${{ always() }}
    steps:
      - name: Require all build and starter checks
        run: |
          test "${{ needs['build-matrix'].result }}" = success
          test "${{ needs['windows-starter-smoke'].result }}" = success
