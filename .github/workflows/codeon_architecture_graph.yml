name: CodeON architecture safety graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm run test:architecture-graph
      - run: npm run test:code-graph
      - run: node scripts/test-system-sensor-toolboxes.js
      - run: node scripts/test-cozmo-simulation-static.js
      - run: node scripts/test-apitor-simulation-static.js
      - run: node scripts/test-codeon-3d-static.js
      - run: node scripts/test-codeon-buddy-security.js
