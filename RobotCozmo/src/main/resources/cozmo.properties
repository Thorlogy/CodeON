robot.plugin.fileExtension.source = json
robot.plugin.fileExtension.binary = json
robot.program.toolbox.beginner = /cozmo/program.toolbox.xml
robot.program.toolbox.expert = /cozmo/program.toolbox.expert.xml
robot.program.default = /cozmo/program.default.xml
robot.configuration.toolbox = /cozmo/configuration.toolbox.xml
robot.configuration.default = /cozmo/configuration.default.xml
robot.real.name = Cozmo
robot.vendor = Anki
robot.announcement = beta
# Cozmo has fixed built-in motors and sensors. The default configuration is
# still used by the validator, but users do not need an editable hardware tab.
robot.configuration = false
robot.configuration.type = new

# Reuse CodeON's tested stack-machine validation and generation pipeline.
robot.plugin.worker.validate.and.collect = de.fhg.iais.roberta.worker.cozmo.CozmoValidatorAndCollectorWorker
robot.plugin.worker.validate.and.collect.sim = de.fhg.iais.roberta.worker.cozmo.CozmoValidatorAndCollectorWorker
robot.plugin.worker.generatesimulation = de.fhg.iais.roberta.worker.cozmo.CozmoStackMachineGeneratorWorker
robot.plugin.worker.regenerateNepo = de.fhg.iais.roberta.worker.RegenerateNepoWorker

robot.plugin.workflow.run = validate.and.collect,generatesimulation,regenerateNepo
robot.plugin.workflow.showsource = validate.and.collect.sim,generatesimulation,regenerateNepo
robot.plugin.workflow.getsimulationcode = do.nothing
