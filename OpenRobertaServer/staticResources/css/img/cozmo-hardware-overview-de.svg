<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Cozmo Hardwareübersicht</title>
  <desc id="desc">Feste Sensoren und Aktoren des Cozmo mit dem Stand ihrer CodeON-Unterstützung</desc>
  <rect width="1400" height="820" fill="#f4f7f9"/>
  <text x="700" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#133b5c">COZMO · FESTE HARDWARE</text>
  <text x="700" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536775">Diese Komponenten sind eingebaut und müssen nicht verkabelt oder konfiguriert werden.</text>
  <rect x="455" y="128" width="490" height="430" rx="28" fill="#fff" stroke="#d9e2e7" stroke-width="2"/>
  <svg x="485" y="170" width="430" height="270" viewBox="0 0 520 320" aria-hidden="true">
    <rect width="520" height="320" rx="28" fill="#f4f7f9"/>
    <g stroke="#133b5c" stroke-width="12" stroke-linejoin="round">
      <path d="M120 218h280l-28 58H148z" fill="#e8edf1"/>
      <path d="M168 196h184l28 56H140z" fill="#f7a928"/>
      <path d="M202 72h116l28 112H174z" fill="#e8edf1"/>
      <rect x="213" y="92" width="94" height="62" rx="13" fill="#133b5c"/>
      <path d="M120 218h-38v-72h92" fill="none"/>
    </g>
    <g fill="#42c0d0"><circle cx="238" cy="123" r="10"/><circle cx="282" cy="123" r="10"/></g>
    <g fill="#133b5c"><circle cx="155" cy="258" r="32"/><circle cx="365" cy="258" r="32"/></g>
    <text x="260" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#133b5c">COZMO</text>
  </svg>
  <text x="700" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#133b5c">Anki Cozmo</text>
  <text x="700" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536775">Grün: programmierbar · Gelb: technisch möglich / geplant · Grau: modellabhängig</text>

  <text x="55" y="145" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0b4a82">SENSOREN (EINGABEN)</text>
  <g font-family="Arial,sans-serif" font-size="20" fill="#17384f">
    <circle cx="70" cy="196" r="9" fill="#2e9b55"/><text x="92" y="203">Kamera · Gesichter</text>
    <circle cx="70" cy="244" r="9" fill="#2e9b55"/><text x="92" y="251">Batteriespannung</text>
    <circle cx="70" cy="292" r="9" fill="#2e9b55"/><text x="92" y="299">Beschleunigung X/Y/Z</text>
    <circle cx="70" cy="340" r="9" fill="#2e9b55"/><text x="92" y="347">Gyroskop X/Y/Z</text>
    <circle cx="70" cy="388" r="9" fill="#2e9b55"/><text x="92" y="395">Raddrehzahl &amp; Position</text>
    <circle cx="70" cy="436" r="9" fill="#2e9b55"/><text x="92" y="443">Kopf- &amp; Lifthöhe</text>
    <circle cx="70" cy="484" r="9" fill="#e4a11b"/><text x="92" y="491">4 Cliff-Sensoren</text>
    <circle cx="70" cy="532" r="9" fill="#87959e"/><text x="92" y="539">Backpack-Taster*</text>
  </g>
  <text x="55" y="579" font-family="Arial,sans-serif" font-size="14" fill="#6a7881">* nur bei unterstützter Hardwareversion</text>

  <text x="1000" y="145" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19723a">AKTOREN (AUSGABEN)</text>
  <g font-family="Arial,sans-serif" font-size="20" fill="#17384f">
    <circle cx="1015" cy="196" r="9" fill="#2e9b55"/><text x="1037" y="203">Fahrmotoren</text>
    <circle cx="1015" cy="244" r="9" fill="#2e9b55"/><text x="1037" y="251">Kopfmotor</text>
    <circle cx="1015" cy="292" r="9" fill="#2e9b55"/><text x="1037" y="299">Lift / Gabelmotor</text>
    <circle cx="1015" cy="340" r="9" fill="#2e9b55"/><text x="1037" y="347">Display / Gesicht</text>
    <circle cx="1015" cy="388" r="9" fill="#2e9b55"/><text x="1037" y="395">Lautsprecher / Sprache</text>
    <circle cx="1015" cy="436" r="9" fill="#2e9b55"/><text x="1037" y="443">Backpack-LEDs</text>
    <circle cx="1015" cy="484" r="9" fill="#e4a11b"/><text x="1037" y="491">IR-Scheinwerfer</text>
  </g>

  <rect x="55" y="635" width="1290" height="125" rx="18" fill="#eaf3f6" stroke="#c9dce4"/>
  <text x="82" y="677" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#133b5c">Hinweis zur Kamera</text>
  <text x="82" y="710" font-family="Arial,sans-serif" font-size="17" fill="#385568">CodeON verarbeitet Kamerabilder ausschließlich lokal auf diesem Computer. Bilder werden nicht an einen Server übertragen.</text>
  <text x="82" y="739" font-family="Arial,sans-serif" font-size="16" fill="#536775">Objekterkennung sowie Cliff-Sensor- und Tasterblöcke werden erst nach Hardwaretests freigeschaltet.</text>
</svg>
