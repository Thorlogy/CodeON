# Open Roberta Plugin-Konfiguration fuer den LEGO Mindstorms RCX
# Ablage: RobotRCX/src/main/resources/rcx.properties
# Vorlage: RobotNXT/src/main/resources/nxt.properties

robot.plugin.compiler.resources.dir = RobotRCX/

robot.plugin.fileExtension.source = nqc
robot.plugin.fileExtension.binary = rcx

# Toolboxen, Default-Programm und -Konfiguration (Dateien muessen erstellt werden,
# Vorlage sind die nxt-Pendants, reduziert auf RCX-Umfang)
robot.program.toolbox.beginner = /rcx.program.toolbox.beginner.xml
robot.program.toolbox.expert = /rcx.program.toolbox.expert.xml
robot.program.default = /rcx.program.default.xml
robot.configuration.toolbox = /rcx.configuration.toolbox.xml
robot.configuration.default = /rcx.configuration.default.xml

robot.configuration = true
robot.configuration.type = old-S
robot.configuration.old.toplevelblock = robBrick_EV3-Brick

robot.real.name = RCX
robot.vendor = na
robot.info.de = https://de.wikipedia.org/wiki/Lego_Mindstorms#RCX
robot.info.en = https://en.wikipedia.org/wiki/Lego_Mindstorms#RCX

# Simulation: mehrere Roboter gleichzeitig erlaubt (wie NXT)
robot.multisim = true

# Kein neuronales Netz auf dem RCX (nur 16-bit int, 32 Variablen)
robot.nn = never

# Helper-Methoden (Datei aus nxt.methods.yml ableiten, nur int-Helfer behalten)
robot.helperMethods = classpath:/rcx.methods.yml

# Worker-Klassen (Namen exakt so anlegen)
robot.plugin.worker.validate.and.collect = de.fhg.iais.roberta.worker.validate.RcxValidatorAndCollectorWorker
robot.plugin.worker.validate.and.collect.sim = de.fhg.iais.roberta.worker.validate.RcxSimValidatorAndCollectorWorker
robot.plugin.worker.generate = de.fhg.iais.roberta.worker.codegen.RcxNqcGeneratorWorker
robot.plugin.worker.setup = de.fhg.iais.roberta.worker.CompilerSetupWorker
robot.plugin.worker.compile = de.fhg.iais.roberta.worker.compile.RcxCompilerWorker
robot.plugin.worker.transfer = de.fhg.iais.roberta.worker.TransferWorker
robot.plugin.worker.generatesimulation = de.fhg.iais.roberta.worker.codegen.RcxStackMachineGeneratorWorker
robot.plugin.worker.regenerateNepo = de.fhg.iais.roberta.worker.RegenerateNepoWorker

# Workflows: zunaechst OHNE "run"-Transfer -> Phase 5 Stufe 1 = compile + Datei-Download
robot.plugin.workflow.showsource = validate.and.collect,generate,regenerateNepo
robot.plugin.workflow.compile = validate.and.collect,generate,setup,compile,regenerateNepo
# "run" erst aktivieren, wenn der Connector (Phase 5, Stufe 2) steht:
robot.plugin.workflow.run = validate.and.collect,generate,setup,compile,regenerateNepo,transfer
robot.plugin.workflow.getsimulationcode = validate.and.collect.sim,generatesimulation,regenerateNepo
robot.plugin.workflow.runnative = setup,compile,transfer
robot.plugin.workflow.compilenative = setup,compile
